<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Manhattan Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500;1,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Josefin+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed city map; CK-style chrome floats over it (top bar + ticker, left drawer, right outliner, bottom-left CEO + menu). Locked to landscape. */
:root{
  --ink:#080d1c; --water:#0b1730; --water2:#10224a; --land:#1b2547; --land2:#232f59; --line:#3a4780;
  --panel:rgba(12,17,36,.9); --panel2:#121a36; --raise:#18224a;
  --brass:#e6c07a; --brass2:#b08a45; --teal:#45d6c1; --coral:#ff7b6b; --violet:#9b87ff; --warn:#f2c14e;
  --fg:#ece8f6; --muted:#97a0c6; --dim:#5e6894;
  --f-display:'Bodoni Moda',Didot,'Times New Roman',serif;
  --f-label:'Josefin Sans','Futura','Century Gothic',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.9,.24,1);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);overflow:hidden}
body{font-family:var(--f-body);font-size:14px;-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{font:inherit;color:var(--fg)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--muted);font-weight:600}
.good{color:var(--teal)} .bad{color:var(--coral)} .warn{color:var(--warn)}

[hidden]{display:none!important}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:var(--water)}
#app.rot{transform-origin:top left;transform:rotate(90deg)}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(4,7,16,.75) 100%)}

/* districts */
.dist{transition:fill .9s var(--ease),fill-opacity .6s var(--ease),stroke .3s;stroke:#46548f;stroke-width:.8;cursor:pointer}
.dist:hover{fill-opacity:.95!important;stroke:#d9e0ff;stroke-width:1.4}
.dist.sel{stroke:var(--brass);stroke-width:2;stroke-dasharray:5 3;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.dlabel{font-family:var(--f-label);font-weight:600;letter-spacing:.06em;fill:#e8ecff;paint-order:stroke;stroke:rgba(8,13,28,.75);stroke-width:2.6px;pointer-events:none;text-transform:uppercase}
.blabel{font-family:var(--f-display);font-style:italic;font-weight:700;fill:#c6d0ff;opacity:.13;pointer-events:none;letter-spacing:.18em}
.marker{cursor:pointer;transition:transform .3s}
.tower{transition:fill .9s var(--ease)}

/* chrome */
.deco{background:var(--panel);border:1px solid rgba(230,192,122,.55);box-shadow:inset 0 0 0 3px rgba(18,26,54,.95),inset 0 0 0 4px rgba(230,192,122,.18),0 18px 40px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#topbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:14px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(9,13,30,.97),rgba(12,18,40,.92));border-bottom:1px solid rgba(230,192,122,.45);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mono{width:30px;height:30px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%)}
.coname{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.cosub{font-family:var(--f-label);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
#res{display:flex;gap:4px;flex:1;justify-content:center;min-width:0;overflow:hidden}
.chip{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:3px;background:rgba(255,255,255,.03);border:1px solid rgba(151,160,198,.14);white-space:nowrap;transition:background .3s}
.chip:hover{background:rgba(230,192,122,.08)}
.chip svg{width:15px;height:15px;flex:none}
.chip .v{font-family:var(--f-num);font-size:13px;font-weight:500}
.chip .k{font-family:var(--f-label);font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.clock{display:flex;align-items:center;gap:8px}
.date{font-family:var(--f-display);font-size:14px;font-weight:500;min-width:96px;text-align:right}
.dprog{height:2px;background:rgba(255,255,255,.08);margin-top:3px;overflow:hidden}
.dprog i{display:block;height:100%;background:var(--brass);width:0}
.speeds{display:flex;border:1px solid rgba(230,192,122,.35);border-radius:3px;overflow:hidden}
.speeds button{width:28px;height:26px;display:grid;place-items:center;font-size:11px;color:var(--muted);transition:background .25s,color .25s}
.speeds button.on{background:var(--brass);color:var(--ink)}
.iconbtn{width:30px;height:28px;display:grid;place-items:center;border:1px solid rgba(230,192,122,.35);border-radius:3px;color:var(--brass);transition:background .25s}
.iconbtn:hover{background:rgba(230,192,122,.12)}
.iconbtn svg{width:16px;height:16px}

#ticker{position:absolute;top:46px;left:0;right:0;height:22px;background:rgba(5,8,18,.88);border-bottom:1px solid rgba(69,214,193,.18);overflow:hidden;z-index:19;font-family:var(--f-num);font-size:11.5px;display:flex;align-items:center}
#tickTrack{display:flex;white-space:nowrap;will-change:transform}
.tk{padding:0 16px;display:inline-flex;gap:7px;color:#cfd5f2}
.tk b{color:var(--brass);font-weight:600}

#alerts{position:absolute;top:76px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:15}
.alert{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 7px;border-radius:20px;background:rgba(12,17,36,.92);border:1px solid rgba(255,123,107,.5);font-size:12px;animation:pop .5s var(--ease) both;transition:transform .2s}
.alert:hover{transform:translateY(-2px)}
.alert i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:11px;background:var(--coral);color:var(--ink)}
.alert.info{border-color:rgba(230,192,122,.5)} .alert.info i{background:var(--brass)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.9)}}

/* bottom-left: CEO + menu */
#dock{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;align-items:flex-end;gap:10px;z-index:18}
#ceoBadge{position:relative;cursor:pointer}
.frame{position:relative;padding:3px;border-radius:52px 52px 6px 6px;background:linear-gradient(160deg,#f5dca3,#9c7536 40%,#e6c07a 60%,#7a5a26);box-shadow:0 10px 26px rgba(0,0,0,.5);transition:transform .35s var(--ease)}
.frame>div{border-radius:49px 49px 4px 4px;overflow:hidden;background:#141b38;line-height:0}
.frame:hover{transform:translateY(-3px)}
#ceoBadge .frame{width:96px}
#ceoBadge .nm{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-label);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--panel2);border:1px solid rgba(230,192,122,.6);padding:3px 7px 2px;color:var(--brass)}
#nav{display:flex;gap:4px;padding:6px;border-radius:4px}
.navb{width:58px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:3px;color:var(--muted);transition:background .3s,color .3s,transform .3s var(--ease);position:relative}
.navb svg{width:21px;height:21px}
.navb span{font-family:var(--f-label);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase}
.navb:hover{color:var(--fg);background:rgba(255,255,255,.05);transform:translateY(-2px)}
.navb.on{color:var(--ink);background:linear-gradient(180deg,#f1d391,#c99f55)}
.navb .dot{position:absolute;top:5px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--panel2)}

/* left drawer */
#panel{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:78px;bottom:96px;width:min(440px,calc(100% - 300px));min-width:300px;z-index:17;display:flex;flex-direction:column;border-radius:4px;transform:translateX(calc(-100% - 30px));opacity:0;transition:transform .55s var(--ease),opacity .4s;pointer-events:none}
#panel.open{transform:none;opacity:1;pointer-events:auto}
.phead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px 16px;border-bottom:1px solid rgba(230,192,122,.25)}
.phead h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em}
.phead .x{width:28px;height:28px;font-size:18px;color:var(--muted);border-radius:3px}
.phead .x:hover{color:var(--fg);background:rgba(255,255,255,.06)}
#panelBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 16px 16px;scrollbar-width:thin;scrollbar-color:var(--brass2) transparent;touch-action:pan-y}
#panelBody.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateX(-14px)}}
.sec{margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(230,192,122,.35),transparent)}
.sec:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(151,160,198,.12);border-radius:3px}
.stat .v{font-family:var(--f-num);font-size:15px;margin-top:3px}
.p{color:var(--muted);font-size:12.5px;line-height:1.5;margin:4px 0 8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:3px;font-family:var(--f-label);font-weight:700;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(180deg,#f1d391,#c99f55);color:var(--ink);transition:transform .25s var(--ease),filter .25s,opacity .25s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brass);border:1px solid rgba(230,192,122,.5)}
.btn.teal{background:linear-gradient(180deg,#6ff0dc,#2fb3a1)}
.btn.red{background:linear-gradient(180deg,#ff9a8d,#e0584a)}
.btn.sm{padding:5px 8px;font-size:9.5px}
.btn[disabled]{opacity:.35;pointer-events:none}

/* dept cards */
.dept{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:9px;border-radius:3px;background:rgba(255,255,255,.025);border:1px solid rgba(151,160,198,.12);margin-bottom:7px;transition:border-color .3s,background .3s}
.dept:hover{border-color:rgba(230,192,122,.35);background:rgba(255,255,255,.04)}
.seat{width:54px;cursor:pointer}
.seat .frame{padding:2px;border-radius:30px 30px 4px 4px}
.seat .frame>div{border-radius:28px 28px 3px 3px}
.empty{height:68px;border:1px dashed rgba(230,192,122,.45);border-radius:28px 28px 3px 3px;display:grid;place-items:center;color:var(--brass);font-size:22px;transition:background .3s}
.empty:hover{background:rgba(230,192,122,.1)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dname{font-family:var(--f-display);font-weight:700;font-size:15px}
.bar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;border-radius:3px;transition:width .8s var(--ease)}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:22px;height:22px;border-radius:3px;background:rgba(255,255,255,.06);font-weight:700;transition:background .2s}
.stepper button:hover{background:rgba(230,192,122,.25)}
.stepper .num{min-width:38px;text-align:center;font-size:12px}
.small{font-size:11.5px;color:var(--muted)}
.trait{display:inline-block;padding:1px 6px;margin:2px 3px 0 0;border-radius:2px;font-size:10px;font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase;background:rgba(155,135,255,.14);color:#c9bfff;border:1px solid rgba(155,135,255,.3)}
.trait.pos{background:rgba(69,214,193,.12);color:#8cf0e0;border-color:rgba(69,214,193,.3)}
.trait.neg{background:rgba(255,123,107,.12);color:#ffb0a6;border-color:rgba(255,123,107,.3)}

.cand{display:grid;grid-template-columns:64px 1fr;gap:11px;padding:10px;border:1px solid rgba(151,160,198,.14);border-radius:3px;margin-bottom:8px;background:rgba(255,255,255,.025);transition:transform .35s var(--ease),border-color .3s;animation:rise .5s var(--ease) both}
.cand:hover{transform:translateX(3px);border-color:rgba(230,192,122,.4)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.cname{font-family:var(--f-display);font-weight:700;font-size:15.5px}
.skill{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:12px;color:var(--brass)}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:5px 10px;border-radius:14px;font-size:11.5px;border:1px solid rgba(151,160,198,.25);color:var(--muted);transition:all .25s}
.tab.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}

/* market */
.stk{display:grid;grid-template-columns:52px 1fr 70px 62px 58px;align-items:center;gap:6px;padding:6px 6px;border-radius:3px;cursor:pointer;transition:background .25s;font-size:12.5px}
.stk:hover{background:rgba(255,255,255,.05)}
.stk.on{background:rgba(230,192,122,.12);box-shadow:inset 2px 0 0 var(--brass)}
.stk .t{font-family:var(--f-num);font-weight:600;color:var(--brass)}
.stk .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11.5px}
.stk .p,.stk .c{font-family:var(--f-num);text-align:right;margin:0;color:var(--fg);font-size:12.5px}
.chartbox{background:rgba(5,9,22,.6);border:1px solid rgba(151,160,198,.14);border-radius:3px;padding:8px;margin:8px 0}
.qty{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.qty button{padding:4px 8px;border-radius:3px;font-family:var(--f-num);font-size:11px;background:rgba(255,255,255,.05);border:1px solid transparent;transition:all .2s}
.qty button.on{border-color:var(--brass);color:var(--brass)}
.qin{width:110px;padding:5px 8px;background:rgba(0,0,0,.3);border:1px solid rgba(151,160,198,.3);border-radius:3px;font-family:var(--f-num)}

.co{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:8px 9px 8px 0;border-bottom:1px solid rgba(151,160,198,.1);transition:background .25s;cursor:pointer}
.co:hover{background:rgba(255,255,255,.04)}
.co .sw{width:8px;align-self:stretch;border-radius:0 2px 2px 0}
.co .cn{font-weight:600;font-size:13px}

/* morale */
.gauge{display:flex;align-items:center;gap:14px;padding:6px 0 4px}
.gauge svg{width:132px;height:80px;flex:none}
.gauge .arc{transition:stroke-dashoffset 1.2s var(--ease),stroke 1s}
.perk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid rgba(151,160,198,.12);border-radius:3px;margin-bottom:6px;transition:border-color .3s,background .3s}
.perk.on{border-color:rgba(69,214,193,.5);background:rgba(69,214,193,.06)}
.toggle{width:38px;height:21px;border-radius:12px;background:rgba(255,255,255,.12);position:relative;transition:background .35s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#dfe3f7;transition:transform .35s var(--ease)}
.perk.on .toggle{background:var(--teal)}
.perk.on .toggle::after{transform:translateX(17px)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid rgba(230,192,122,.35);border-radius:3px;overflow:hidden}
.seg button{padding:7px 4px;font-size:11.5px;transition:background .3s,color .3s;color:var(--muted)}
.seg button.on{background:var(--brass);color:var(--ink);font-weight:600}
.brk{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dotted rgba(151,160,198,.15)}
.crowd{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}
.crowd i{width:9px;height:14px;border-radius:5px 5px 2px 2px;display:block;transition:background 1s;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}

/* rivals */
.rival{display:grid;grid-template-columns:60px 1fr;gap:11px;padding:10px;border-radius:3px;margin-bottom:8px;background:rgba(255,255,255,.025);border:1px solid rgba(151,160,198,.12);border-left:3px solid}
.lead{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.lead .b{height:12px;border-radius:2px;transition:width 1s var(--ease)}

/* outliner */
#outliner{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:78px;width:236px;max-height:calc(100% - 200px);overflow-y:auto;border-radius:4px;z-index:16;padding:10px 10px 6px;transition:transform .5s var(--ease),opacity .4s;scrollbar-width:none;touch-action:pan-y}
#outliner.hide{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
.ol-h{display:flex;align-items:center;justify-content:space-between;margin:8px 0 5px}
.ol-h:first-child{margin-top:0}
.ol-row{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:3px;cursor:pointer;font-size:12px;transition:background .25s}
.ol-row:hover{background:rgba(255,255,255,.05)}
.ol-row .mini{width:26px;height:32px;border-radius:13px 13px 2px 2px;overflow:hidden;flex:none;border:1px solid rgba(230,192,122,.5);line-height:0}
.ol-row .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#olToggle{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:78px;z-index:16;display:none}

/* district card */
#dcard{position:absolute;right:max(256px,calc(env(safe-area-inset-right,0px) + 256px));top:78px;width:250px;z-index:16;border-radius:4px;padding:12px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:transform .45s var(--ease),opacity .35s}
#dcard.open{transform:none;opacity:1;pointer-events:auto}
#dcard h3{margin:2px 0 2px;font-family:var(--f-display);font-size:19px}

#toasts{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column-reverse;gap:6px;z-index:25;width:290px;pointer-events:none}
.toast{padding:9px 12px;border-radius:3px;font-size:12.5px;line-height:1.4;background:rgba(12,17,36,.95);border:1px solid rgba(151,160,198,.25);border-left:3px solid var(--brass);box-shadow:0 10px 24px rgba(0,0,0,.4);animation:tin .6s var(--ease) both;transition:opacity .5s,transform .5s var(--ease)}
.toast.good{border-left-color:var(--teal)} .toast.bad{border-left-color:var(--coral)}
.toast.out{opacity:0;transform:translateX(30px)}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}

/* modal */
#modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(4,7,16,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .35s both;padding:12px}
@keyframes fade{from{opacity:0}}
.ev{width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:4px;animation:evin .6s var(--ease) both;overflow:hidden}
@keyframes evin{from{opacity:0;transform:translateY(22px) scale(.96)}}
.ev-title{text-align:center;padding:12px 16px 10px;font-family:var(--f-display);font-weight:700;font-size:22px;border-bottom:1px solid rgba(230,192,122,.3);background:linear-gradient(180deg,rgba(230,192,122,.12),transparent)}
.ev-body{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 16px;overflow-y:auto;touch-action:pan-y}
.ev-art{position:relative}
.ev-text{font-size:14px;line-height:1.6;color:#d9dcf0}
.ev-text em{font-family:var(--f-display);font-size:15px;color:var(--brass)}
.ev-opts{display:flex;flex-direction:column;gap:6px;padding:0 16px 14px}
.opt{text-align:left;padding:9px 12px;border-radius:3px;border:1px solid rgba(230,192,122,.4);background:rgba(230,192,122,.06);transition:background .25s,transform .25s var(--ease),border-color .25s}
.opt:hover{background:rgba(230,192,122,.16);transform:translateX(4px);border-color:var(--brass)}
.opt b{display:block;font-weight:600;font-size:13.5px}
.opt span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.opt[disabled]{opacity:.4;pointer-events:none}
.slider{width:100%;accent-color:var(--brass)}

/* start screen */
#start{position:absolute;inset:0;z-index:60;background:linear-gradient(180deg,#070b1a 0%,#121a3f 55%,#2a2350 78%,#5a3a5c 100%);display:grid;grid-template-columns:1.1fr 1fr;overflow:hidden;transition:opacity .9s var(--ease),transform .9s var(--ease)}
#start.gone{opacity:0;transform:scale(1.04);pointer-events:none}
#skyline{position:absolute;inset:0;width:100%;height:100%}
.st-left{position:relative;display:flex;flex-direction:column;justify-content:center;padding:24px 24px 24px max(32px,env(safe-area-inset-left,0px));z-index:2}
.st-title{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6.4vw,78px);line-height:.92;margin:0;letter-spacing:-.01em;text-wrap:balance}
.st-title span{display:block;font-style:italic;font-weight:500;color:var(--brass)}
.st-title .w{display:inline-block;animation:lett 1.1s var(--ease) both}
@keyframes lett{from{opacity:0;transform:translateY(24px);filter:blur(6px)}}
.st-tag{font-family:var(--f-label);letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:#c7cdf0;margin-top:14px;animation:lett 1.2s .6s var(--ease) both}
.st-right{position:relative;z-index:2;overflow-y:auto;padding:16px max(20px,env(safe-area-inset-right,0px)) 16px 8px;display:flex;align-items:center;touch-action:pan-y}
.setup{width:100%;border-radius:4px;padding:16px;animation:evin .9s .3s var(--ease) both}
.setup .row{display:grid;grid-template-columns:96px 1fr;gap:14px}
.field{margin-bottom:10px}
.field input[type=text]{width:100%;box-sizing:border-box;padding:8px 10px;background:rgba(0,0,0,.35);border:1px solid rgba(151,160,198,.3);border-radius:3px;font-family:var(--f-display);font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pill{padding:5px 9px;border-radius:3px;font-size:11.5px;border:1px solid rgba(151,160,198,.25);color:#cdd2ee;transition:all .25s}
.pill.on{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;transition:transform .25s var(--ease)}
.sw.on{border-color:#fff;transform:scale(1.15)}
select{width:100%;padding:7px 8px;background:rgba(0,0,0,.35);border:1px solid rgba(151,160,198,.3);border-radius:3px;color:var(--fg);font:inherit}

/* avatars */
.av{display:block;width:100%;height:auto}
.av .eyes{animation:blink 6s infinite;transform-origin:50px 51px;transform-box:view-box}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.breathe .fig{animation:breathe 4.5s ease-in-out infinite;transform-origin:50px 120px;transform-box:view-box}
@keyframes breathe{50%{transform:translateY(.8px) scale(1.006)}}

function clipHalf(poly,a,b){const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,nx=b[0]-a[0],ny=b[1]-a[1];const inside=p=>(p[0]-mx)*nx+(p[1]-my)*ny<=0;const out=[];for(let i=0;i<poly.length;i++){const P=poly[i],Q=poly[(i+1)%poly.length];const pi=inside(P),qi=inside(Q);if(pi)out.push(P);if(pi!==qi){const dp=(P[0]-mx)*nx+(P[1]-my)*ny,dq=(Q[0]-mx)*nx+(Q[1]-my)*ny;const t=dp/(dp-dq);out.push([P[0]+(Q[0]-P[0])*t,P[1]+(Q[1]-P[1])*t])}}return out}

function lineChart(arr,o){
 const w=o.w,h=o.h;if(arr.length<2)return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto"></svg>`;
 const mn=Math.min(...arr),mx=Math.max(...arr);const pad=(mx-mn)*.12||1;const lo=mn-pad,hi=mx+pad;
 const X=i=>(i/(arr.length-1))*(w-46),Y=v=>h-6-((v-lo)/(hi-lo))*(h-14);
 const pts=arr.map((v,i)=>X(i).toFixed(1)+' '+Y(v).toFixed(1));const id='lg'+(AVID++);
 let g='';for(let i=0;i<4;i++){const v=lo+(hi-lo)*(i+.5)/4;const y=Y(v);g+=`<path d="M0 ${y.toFixed(1)}H${w-46}" stroke="#97a0c6" stroke-opacity=".1"/><text x="${w-42}" y="${(y+3).toFixed(1)}" font-size="9" fill="#97a0c6" font-family="IBM Plex Mono,monospace">${o.fmt(v)}</text>`}
 let ex='';if(o.ref){const y=Y(o.ref);if(y>0&&y<h)ex=`<path d="M0 ${y.toFixed(1)}H${w-46}" stroke="#e6c07a" stroke-dasharray="3 3" stroke-opacity=".7"/><text x="4" y="${(y-3).toFixed(1)}" font-size="8.5" fill="#e6c07a" font-family="Josefin Sans,sans-serif" letter-spacing="1">YOUR AVG COST</text>`}
 const last=arr.length-1;
 return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${o.col}" stop-opacity=".35"/><stop offset="1" stop-color="${o.col}" stop-opacity="0"/></linearGradient></defs>${g}<path d="M${pts.join('L')}L${X(last).toFixed(1)} ${h}L0 ${h}Z" fill="url(#${id})"/><path d="M${pts.join('L')}" fill="none" stroke="${o.col}" stroke-width="1.6" stroke-linejoin="round"/>${ex}<circle cx="${X(last).toFixed(1)}" cy="${Y(arr[last]).toFixed(1)}" r="3.2" fill="${o.col}" stroke="#0a0f22" stroke-width="1.2"/></svg>`}

function sceneArt(seed,tint){const r=rng(seed);let b='';let x=0;while(x<150){const w=8+r()*16,h=20+r()*70;b+=`<rect x="${x.toFixed(0)}" y="${(150-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="#0a0f22"/>`;for(let wy=150-h+5;wy<146;wy+=6)for(let wx=x+2;wx<x+w-2;wx+=4)if(r()<.3)b+=`<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="1.6" height="2" fill="#ffd98a" opacity="${(.4+r()*.5).toFixed(2)}"/>`;x+=w+1}return `<svg viewBox="0 0 150 150" style="position:absolute;inset:0;width:100%;height:100%"><defs><linearGradient id="sk${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1430"/><stop offset="1" stop-color="${tint}"/></linearGradient></defs><rect width="150" height="150" fill="url(#sk${seed})"/>${b}</svg>`}

function offerModal(s){
 UI.offer={id:s.id,pct:1};const draw=()=>{const p=askPrice(s)*UI.offer.pct;const ch=acqChance(s,UI.offer.pct);const box=$('#offerBox');if(!box)return;box.innerHTML=`<div class="grid3"><div class="stat"><div class="lbl">Your offer</div><div class="v">${fmt$(p)}</div></div><div class="stat"><div class="lbl">Success</div><div class="v ${ch>.6?'good':ch<.35?'bad':'warn'}">${Math.round(ch*100)}%</div></div><div class="stat"><div class="lbl">Profit/mo</div><div class="v">${fmt$(s.rev*s.margin*(s.sector===S.co.sector?1.15:1))}</div></div></div><div class="small" style="margin-top:6px">Payback ≈ ${Math.round(p/(s.rev*s.margin*(s.sector===S.co.sector?1.15:1)))} months. A failed bid costs 5% in advisory fees.</div>`;$('#offerGo').disabled=S.co.cash<p};
 const hostile=s.owner&&s.owner!=='you';const owner=hostile?S.chars[S.rivals.find(r=>r.id===s.owner).ceo]:null;
 openModal(`<div class="ev deco" style="width:min(560px,100%)"><div class="ev-title">${hostile?'Hostile Bid':'Acquisition Offer'}: ${esc(s.name)}</div><div class="ev-body" style="grid-template-columns:${owner?'110px ':''}1fr">${owner?`<div>${portrait(owner,110)}<div class="small" style="text-align:center;margin-top:4px">${esc(owner.name)}</div></div>`:''}<div><div class="small">${SECTORS[s.sector].n} · ${DM[s.d].n} · revenue ${fmt$(s.rev)}/mo · margin ${(s.margin*100).toFixed(0)}%</div><p class="p">${hostile?`${esc(nameOf(s.owner))} will fight this. Legal strength and your cunning improve the odds.`:'The founders will hear you out. Legal and Finance strength and your negotiation improve the odds.'}</p><label class="lbl" for="offerSl">Offer vs. asking (${fmt$(askPrice(s))})</label><input class="slider" id="offerSl" type="range" min="70" max="160" value="100"><div id="offerBox"></div></div></div><div class="ev-opts" style="flex-direction:row;justify-content:flex-end"><button class="btn ghost" data-act="mclose">Walk away</button><button class="btn" id="offerGo" data-act="offergo">Submit offer</button></div></div>`);

}
function doOffer(){const s=S.smalls.find(x=>x.id===UI.offer.id);const p=askPrice(s)*UI.offer.pct;const ch=acqChance(s,UI.offer.pct);closeModal();
 if(S.co.cash<p)return toast('Not enough cash for that offer.','bad');
 const prev=s.owner;
 if(R()<ch){S.co.cash-=p;s.owner='you';s.price=smallPrice(s);S.co.rep=clamp(S.co.rep+2,0,100);if(prev){const rv=S.rivals.find(r=>r.id===prev);rv.cash+=p*.8;S.chars[rv.ceo].opinion-=25}
  fxArc(S.co.hq,s.d,S.co.color);setTimeout(()=>{renderMarkers();paintDistricts();renderAlerts()},900);toast(`<b>${esc(s.name)}</b> is yours for ${fmt$(p)}.`,'good');flyTo(DM[s.d].c[0],DM[s.d].c[1],Math.min(VT.w,560))}
 else{S.co.cash-=p*.05;s.cool=monthIdx()+2;if(!prev)s.price=Math.round(s.price*1.1);else S.chars[S.rivals.find(r=>r.id===prev).ceo].opinion-=10;toast(`${esc(s.name)} rejected your ${prev?'bid':'offer'}. ${fmt$(p*.05)} lost in fees.`,'bad')}
 refreshAll()}

function rollEvent(){const ok=EVENTS.filter(e=>e.cond()&&(S.flags['ev_'+e.id]||-99)+3<=monthIdx());if(!ok.length)return;let tot=ok.reduce((a,e)=>a+e.w,0),r=R()*tot;for(const e of ok){r-=e.w;if(r<=0){S.flags['ev_'+e.id]=monthIdx();showEvent(e.make());return}}}
function loseHead(h,rv){S.co.depts[h.dept].head=null;toast(`${esc(h.name)} left ${rv?'for '+esc(rv.name):'the company'}.`,'bad');if(rv)rv.base*=1.01;delete S.chars[h.id];S.co.morale-=3;refreshAll()}

/* ============ simulation ============ */
function dayTick(){
 const prevM=new Date(S.date).getUTCMonth();S.date+=864e5;const d=new Date(S.date);
 // market
 S.mkt=S.mkt*.9+gauss()*.0015;const mk=gauss()*.006+S.mkt;const sh={};for(const k in SECTORS)sh[k]=gauss()*.006;
 S.stocks.forEach(s=>{s.prev=s.price;const r=s.drift/252+s.vol/15.9*gauss()+mk*s.beta+sh[s.sector]+s.mo;s.mo*=.85;s.price=Math.max(.5,s.price*Math.exp(r));s.hist.push(s.price);if(s.hist.length>150)s.hist.shift()});
 if(R()<1/25){const s=pick(S.stocks);const up=R()<.55;const m=(.05+R()*.09)*(up?1:-1);s.price*=1+m;s.mo+=m*.05;toast(`<b class="num">${s.t}</b> ${up?'beats':'misses'} earnings: ${fmtPct(m)}`,up?'good':'bad')}
 if(d.getUTCMonth()!==prevM)monthTick();
 updateTop();updTicker();refreshMarket();
}
function monthTick(){
 const mi=monthIdx();const e=econ();
 S.co.cash+=e.profit;
 S.co.lastPL={core:e.core,subs:e.subs,ctrl:e.ctrl,interest:e.interest,staffCost:e.staffCost,headCost:e.headCost,rent:e.rent,perks:e.perks,save:(e.staffCost+e.headCost+e.rent+e.perks)*e.opsSave,profit:e.profit};
 // quality / rep / morale
 const vis=heads().filter(h=>h.traits.includes('visionary')).length;
 S.co.quality=clamp(S.co.quality+e.E.eng*.42+(cst('vis')-8)*.06+vis*.6-S.co.quality*.035,0,100);
 const net=heads().filter(h=>h.traits.includes('networker')).length;
 S.co.rep=clamp(S.co.rep+e.E.mkt*.35+net*.6-(S.co.rep-30)*.045+S.mods.reduce((a,m)=>a+(m.rep||0),0),0,100);
 S.co.morale=clamp(S.co.morale+(moraleTarget()-S.co.morale)*.35,0,100);
 // executives
 heads().forEach(h=>{let d=(S.co.morale-50)*.06+(h.salary/askSalary(h)-1)*12;h.traits.forEach(t=>d+=TRAITS[t].op||0);if(S.co.perks.equity)d+=1;h.opinion=clamp(h.opinion+d,-100,100)});
 // birthdays
 if(new Date(S.date).getUTCMonth()===0)Object.values(S.chars).forEach(c=>c.age++);
 // mods decay
 S.mods.forEach(m=>m.left--);S.mods=S.mods.filter(m=>m.left>0);
 // subsidiaries drift
 S.smalls.forEach(s=>{s.rev*=1+(gauss()*.02+.004);s.price=smallPrice(s)});
 // candidates
 const drop=S.cands.splice(0,2);drop.forEach(id=>delete S.chars[id]);while(S.cands.length<6)S.cands.push(newCand().id);
 // rivals
 S.rivals.forEach(r=>{r.base*=1+.004+gauss()*.012;r.cash+=r.base*.004;S.chars[r.ceo].opinion=clamp(S.chars[r.ceo].opinion*.96,-100,100);
  if(R()<r.aggr){const t=S.smalls.filter(s=>!s.owner&&s.price<r.cash).sort((a,b)=>dist(a.d,r.hq)-dist(b.d,r.hq))[Math.floor(R()*3)];if(t){r.cash-=t.price;t.owner=r.id;fxArc(r.hq,t.d,r.color);setTimeout(()=>{renderMarkers();paintDistricts()},900);toast(`<span style="color:${r.color}">${esc(r.short)}</span> acquired ${esc(t.name)} in ${DM[t.d].s}.`)}}});
 // pending
 S.pending=S.pending.filter(p=>{if(p.at>mi)return true;if(p.k==='startup'){if(R()<.35){S.co.cash+=6e6;info('The Bet Paid Off',`<em>${esc(p.nm)}</em> just closed a huge round. Your ${fmt$(1e6)} stake is now worth ${fmt$(6e6)}, paid out in cash.`)}else toast(`${esc(p.nm)} quietly shut down. The ${fmt$(1e6)} is gone.`,'bad')}return false});
 S.hist.push(valuation());if(S.hist.length>120)S.hist.shift();
 const mname=MONTHS[(new Date(S.date).getUTCMonth()+11)%12];
 toast(`${mname} books closed: <b class="num ${e.profit>=0?'good':'bad'}">${sgn(e.profit)}</b>`,e.profit>=0?'good':'bad');
 refreshAll();
 checkEnd();
 if(!G.modal&&R()<.5)rollEvent();
 save();
}
function checkEnd(){
 if(S.co.cash<-12e6&&!S.won.bust){S.won.bust=1;showEvent({title:'Chapter 11',seed:5,tint:'#5a2a2a',text:`The banks have called in the loans. ${esc(S.co.name)} files for bankruptcy protection in the Southern District of New York. Every empire has a final chapter.`,opts:[{l:'Start a new dynasty',t:'Return to the title screen',go(){wipe();location.reload()}},{l:'Fight on with an emergency loan',t:`Cash set to ${fmt$(2e6)} · reputation −25`,go(){S.co.cash=2e6;S.co.rep=clamp(S.co.rep-25,0,100);S.won.bust=0}}]});return}
 if(!S.won.emp&&myDistricts()>=14){S.won.emp=1;showEvent({title:'Empire of New York',who:ceo(),seed:9,tint:'#6a5a2a',text:`Fourteen districts fly your colors. From the Battery to the Bronx, nothing is built, sold or signed without ${esc(S.co.name)} hearing about it first.`,opts:[{l:'Keep building',t:'Continue playing',go(){}}]})}
 if(!S.won.titan&&(S._val||0)>=2.5e9){S.won.titan=1;showEvent({title:'Titan of Wall Street',who:ceo(),seed:8,tint:'#6a5a2a',text:`${esc(S.co.name)} is worth ${fmt$(S._val)}. The Exchange floor goes quiet when your name scrolls past.`,opts:[{l:'Keep building',t:'Continue playing',go(){}}]})}
}
function refreshAll(){updateTop();renderAlerts();renderOutliner();renderCEO();if(UI.panel)renderPanel();if(UI.sel)selectDistrict(UI.sel)}

/* ============ save ============ */
const SAVE='md_save_v1';
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVE);return t?JSON.parse(t):null}catch(e){return null}}
function wipe(){try{localStorage.removeItem(SAVE)}catch(e){}}

 stockmap:el=>{UI.stock=el.dataset.id;const s=S.stocks.find(x=>x.t===UI.stock);selectDistrict(s.d);openPanel('market')},
 qty:el=>{const s=S.stocks.find(x=>x.t===UI.stock);let q=el.dataset.v==='max'?Math.max(1,Math.floor(Math.max(0,S.co.cash)/(s.price*(1+fee())))):+el.dataset.v;UI.qty=q;$('#qin').value=q;document.querySelectorAll('#qchips button').forEach(b=>b.classList.toggle('on',b===el));updCost()},
 buy:()=>{const s=S.stocks.find(x=>x.t===UI.stock);let q=Math.floor(+$('#qin').value||0);q=Math.min(q,s.shares-s.own);if(q<=0)return;const cost=q*s.price*(1+fee());if(cost>S.co.cash)return toast('Not enough cash for that order.','bad');S.co.cash-=cost;s.cost=(s.cost*s.own+cost)/(s.own+q);s.own+=q;const imp=q/s.shares*.9;s.price*=1+imp;s.hist[s.hist.length-1]=s.price;toast(`Bought ${fmtN(q)} ${s.t} for ${fmt$(cost)}.`,'good');refreshAll()},
 sell:()=>{const s=S.stocks.find(x=>x.t===UI.stock);let q=Math.min(Math.floor(+$('#qin').value||0),s.own);if(s.ctrl==='you')return toast('You control this company. Its shares are locked.','bad');if(q<=0)return toast('You hold no shares to sell.','bad');const imp=q/s.shares*.9;s.price*=1-imp;const got=q*s.price*(1-fee());S.co.cash+=got;s.own-=q;if(!s.own)s.cost=0;s.hist[s.hist.length-1]=s.price;toast(`Sold ${fmtN(q)} ${s.t} for ${fmt$(got)}.`,got>=q*s.cost?'good':'bad');refreshAll()},
 seize:()=>{const s=S.stocks.find(x=>x.t===UI.stock);s.ctrl='you';S.co.rep=clamp(S.co.rep+6,0,100);fxArc(S.co.hq,s.d,S.co.color);setTimeout(()=>{renderMarkers();paintDistricts()},900);showEvent({title:'Control Seized',who:ceo(),seed:13,tint:'#2a5a4a',text:`You walk into the boardroom of <em>${esc(s.n)}</em> as its new controlling shareholder. The old directors have already cleared their desks.`,opts:[{l:'Excellent',t:`+${fmt$(s.price*s.shares*.006)}/mo · district influence +3`,go(){}}]})},
 small:el=>{const s=S.smalls.find(x=>x.id===el.dataset.id);if(!s)return;selectDistrict(s.d);flyTo(s.pos[0],s.pos[1],Math.min(VT.w,520));if(s.owner!=='you'){if(s.cool>monthIdx())return toast(`${esc(s.name)} won't take meetings for a while.`,'bad');offerModal(s)}else{UI.acqFilter='mine';openPanel('acquire')}},
 offer:el=>{const s=S.smalls.find(x=>x.id===el.dataset.id);offerModal(s)},
 offergo:()=>doOffer(),
 sellsub:el=>{const s=S.smalls.find(x=>x.id===el.dataset.id);showEvent({title:'Sell '+s.name+'?',text:`A buyer will pay ${fmt$(s.price*.9)} today. The business returns to independent hands.`,opts:[{l:'Sell',t:`+${fmt$(s.price*.9)}`,go(){S.co.cash+=s.price*.9;s.owner=null;renderMarkers();paintDistricts()}},{l:'Keep it',t:'Nothing happens',go(){}}]})},
 acqf:el=>{UI.acqFilter=el.dataset.v;renderPanel(false)},
 dist:el=>{const d=DM[el.dataset.id];selectDistrict(d.id);flyTo(d.c[0],d.c[1],Math.min(VT.w,560))},
 perk:el=>{const k=el.dataset.v;S.co.perks[k]=!S.co.perks[k];toast(`${PERKS[k].n} ${S.co.perks[k]?'switched on':'cancelled'}.`,S.co.perks[k]?'good':'');refreshAll()},
 pay:el=>{S.co.pay=el.dataset.v;refreshAll()},
 oneoff:el=>{const o=ONEOFF.find(x=>x.k===el.dataset.v);const c=o.cost();if(S.co.cash<c)return toast('Not enough cash.','bad');S.co.cash-=c;S.cds[o.k]=monthIdx()+o.cd;addMod(o.n,{mor:o.mor,left:o.months});S.co.morale=clamp(S.co.morale+o.mor*.6,0,100);if(o.op)heads().forEach(h=>h.opinion+=o.op);toast(`${o.n}! Morale is climbing.`,'good');confetti();refreshAll()},
 decide:el=>{const d=DECISIONS.find(x=>x.k===el.dataset.v);const c=d.cost();if(!d.noPay){if(S.co.cash<c)return;S.co.cash-=c}if(d.cd)S.cds['d_'+d.k]=monthIdx()+d.cd;d.go();refreshAll();if(d.k==='office'||d.k==='ipo')renderMarkers()},
 reloc:el=>{if(S.co.cash<3e6){closeModal();return toast('Moving costs '+fmt$(3e6)+'.','bad')}const from=S.co.hq;S.co.cash-=3e6;S.co.hq=el.dataset.id;closeModal();fxArc(from,S.co.hq,S.co.color);setTimeout(()=>{renderMarkers();paintDistricts()},900);toast(`Headquarters moved to ${DM[S.co.hq].n}.`,'good');refreshAll()}
};
function handleAct(el){const a=el.dataset.act;if(ACT[a])ACT[a](el);else if(SACT[a])SACT[a](el)}
document.addEventListener('click',e=>{if(e.target.closest('#map'))return;const el=e.target.closest('[data-act]');if(el)handleAct(el)});
document.addEventListener('keydown',e=>{if(!G.running||e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();if(G.modal)return;if(S.speed){G.prevSpeed=S.speed;S.speed=0}else S.speed=G.prevSpeed||1;updateTop()}else if(['Digit1','Digit2','Digit3'].includes(e.code)&&!G.modal){S.speed=+e.code.slice(5);updateTop()}else if(e.code==='Escape'){if(G.modal&&!G.opts)closeModal();else if(!G.modal)closePanel()}});
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal'&&!G.opts)closeModal()});

function toast(html,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.innerHTML=html;const box=$('#toasts');box.prepend(t);while(box.children.length>5)box.lastChild.remove();setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),550)},5200)}
function confetti(){const c=S.co.color;const g=$('#gFx');const d=DM[S.co.hq].c;for(let i=0;i<18;i++){const a=Math.random()*6.28,r=10+Math.random()*26;const el=document.createElementNS(NS,'circle');el.setAttribute('r','1.6');el.setAttribute('fill',[c,'#fff','#45d6c1','#ff6fae'][i%4]);el.innerHTML=`<animate attributeName="cx" from="${d[0]}" to="${d[0]+Math.cos(a)*r}" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .9 .25 1" keyTimes="0;1"/><animate attributeName="cy" from="${d[1]-10}" to="${d[1]-10+Math.sin(a)*r+12}" dur="1.2s" fill="freeze" calcMode="spline" keySplines=".2 .9 .25 1" keyTimes="0;1"/><animate attributeName="opacity" from="1" to="0" dur="1.4s" fill="freeze"/>`;g.appendChild(el);setTimeout(()=>el.remove(),1500)}}

/* ============ start screen ============ */
const SETUP={name:'',sector:'tech',color:'#e6c07a',hq:'chelsea',edu:'wharton',pers:'shrewd',fem:false,seed:Math.floor(Math.random()*1e9),ceoName:''};
const PCOLORS=['#e6c07a','#4cc9f0','#ff9a52','#ff6fae'];
function skylineSVG(){const r=rng(42);let b='',w='';let x=0;const H=1000;
 const layer=(base,scale,col,lights)=>{let s='';let x=-20;while(x<1620){const bw=(26+r()*58)*scale,bh=(80+r()*320)*scale*(r()<.12?1.8:1);const y=base-bh;s+=`<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${bw.toFixed(0)}" height="${(bh+40).toFixed(0)}" fill="${col}"/>`;if(r()<.25)s+=`<path d="M${x+bw*.2} ${y}L${x+bw/2} ${y-bh*.18}L${x+bw*.8} ${y}Z" fill="${col}"/><rect x="${(x+bw/2-1).toFixed(0)}" y="${(y-bh*.26).toFixed(0)}" width="2" height="${(bh*.1).toFixed(0)}" fill="${col}"/>`;
  if(lights)for(let wy=y+10;wy<base-6;wy+=12*scale)for(let wx=x+5;wx<x+bw-6;wx+=9*scale)if(r()<.22)w+=`<rect class="win" x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="${(4*scale).toFixed(1)}" height="${(5*scale).toFixed(1)}" fill="#ffd98a" style="animation-delay:${(r()*8).toFixed(2)}s;animation-duration:${(4+r()*8).toFixed(1)}s"/>`;x+=bw+2*scale}return s};
 b+=layer(820,.9,'#1b1f45',false)+layer(900,1.15,'#12153a',true)+layer(1000,1.45,'#0a0d26',true);
 return `<svg id="skyline" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><radialGradient id="moon"><stop offset="0" stop-color="#fff4d6"/><stop offset=".25" stop-color="#ffe7b0" stop-opacity=".6"/><stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/></radialGradient></defs><circle cx="1250" cy="220" r="160" fill="url(#moon)"/><circle cx="1250" cy="220" r="38" fill="#fff1cf"/>${Array.from({length:60},()=>`<circle cx="${(r()*1600).toFixed(0)}" cy="${(r()*500).toFixed(0)}" r="${(r()*1.3+.3).toFixed(1)}" fill="#fff" opacity="${(r()*.6+.2).toFixed(2)}"/>`).join('')}${b}${w}<rect y="960" width="1600" height="40" fill="#070a1c"/></svg><style>.win{animation:twk 6s ease-in-out infinite}@keyframes twk{0%,100%{opacity:.9}50%{opacity:.25}}</style>`}
function renderStart(){
 const saved=load();
 const st=$('#start');
 const cc={id:'x',fem:SETUP.fem,age:34,seed:SETUP.seed,traits:[],opinion:60};
 if(!SETUP.name)SETUP.name=pick(PREF)+' '+pick(['Industries','Holdings','Group','& Co.','Enterprises']);
 if(!SETUP.ceoName)SETUP.ceoName=(SETUP.fem?pick(FIRST_F):pick(FIRST_M))+' '+pick(LAST);
 const words='Manhattan'.split('');
 st.innerHTML=`${skylineSVG()}<div class="st-left"><h1 class="st-title"><span class="w" style="animation-delay:.05s">Manhattan</span> <span class="w" style="animation-delay:.25s">Dynasty</span></h1><div class="st-tag">Build a company · Rule five boroughs</div><p style="max-width:42ch;color:#c7cdf0;line-height:1.6;font-size:14px;margin-top:18px;animation:lett 1.2s .8s var(--ease) both">Hire a council of executives, keep your people happy, play the Exchange, and buy up the city one business at a time. Three old families stand in your way.</p></div>
 <div class="st-right"><div class="setup deco" id="setup"></div></div>`;
 renderSetup(saved);
}
function renderSetup(saved){
 const cc={id:'x',fem:SETUP.fem,age:34,seed:SETUP.seed,traits:[],opinion:60,bg:SETUP.color};
 $('#setup').innerHTML=`${saved?`<button class="btn teal" style="width:100%;margin-bottom:12px" data-act="continue">Continue ${esc(saved.co.name)} · ${(()=>{const d=new Date(saved.date);return MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear()})()}</button>`:''}
 <div class="lbl" style="margin-bottom:8px;color:var(--brass)">Found your company</div>
 <div class="row"><div><div data-act="reroll" title="New look" style="cursor:pointer">${portrait(cc,96,'breathe')}</div><button class="btn sm ghost" style="width:100%;margin-top:6px" data-act="reroll">New face</button><button class="btn sm ghost" style="width:100%;margin-top:4px" data-act="gender">${SETUP.fem?'Woman':'Man'}</button></div>
 <div style="min-width:0"><div class="field"><label class="lbl" for="inCo">Company name</label><input id="inCo" type="text" maxlength="28" value="${esc(SETUP.name)}"></div><div class="field"><label class="lbl" for="inCeo">Founder</label><input id="inCeo" type="text" maxlength="28" value="${esc(SETUP.ceoName)}"></div>
 <div class="field"><span class="lbl">Colors</span><div class="pills">${PCOLORS.map(c=>`<button class="sw ${SETUP.color===c?'on':''}" style="background:${c}" data-act="color" data-v="${c}" aria-label="Color ${c}"></button>`).join('')}</div></div></div></div>
 <div class="field"><span class="lbl">Industry</span><div class="pills">${Object.entries(SECTORS).map(([k,s])=>`<button class="pill ${SETUP.sector===k?'on':''}" data-act="sector" data-v="${k}">${s.n}</button>`).join('')}</div><div class="small" style="margin-top:4px">${SECTORS[SETUP.sector].d}</div></div>
 <div class="field"><span class="lbl">Education</span><div class="pills">${Object.entries(EDU).map(([k,s])=>`<button class="pill ${SETUP.edu===k?'on':''}" data-act="edu" data-v="${k}">${s.n}</button>`).join('')}</div></div>
 <div class="field"><span class="lbl">Temperament</span><div class="pills">${Object.entries(PERS).map(([k,s])=>`<button class="pill ${SETUP.pers===k?'on':''}" data-act="pers" data-v="${k}">${s.n}</button>`).join('')}</div></div>
 <div class="field"><label class="lbl" for="inHq">Headquarters</label><select id="inHq">${DIST.filter(d=>!['ues','fidi','wburg'].includes(d.id)).map(d=>`<option value="${d.id}" ${SETUP.hq===d.id?'selected':''}>${d.n} (${BOROUGHS[d.b].n}) · rent ×${d.rent}</option>`).join('')}</select></div>
 <button class="btn" style="width:100%;padding:11px;font-size:12px" data-act="found">${saved?'Start a new dynasty':'Found the company'}</button>`;
 const keep=()=>{SETUP.name=$('#inCo').value;SETUP.ceoName=$('#inCeo').value;SETUP.hq=$('#inHq').value};
 ['inCo','inCeo','inHq'].forEach(id=>{$('#'+id).addEventListener('change',keep);$('#'+id).addEventListener('input',keep)});
}
const SACT={
 reroll:()=>{SETUP.seed=Math.floor(Math.random()*1e9);renderSetup(load())},
 gender:()=>{SETUP.fem=!SETUP.fem;SETUP.ceoName=(SETUP.fem?pick(FIRST_F):pick(FIRST_M))+' '+SETUP.ceoName.split(' ').slice(1).join(' ');renderSetup(load())},
 color:el=>{SETUP.color=el.dataset.v;renderSetup(load())},
 sector:el=>{SETUP.sector=el.dataset.v;renderSetup(load())},
 edu:el=>{SETUP.edu=el.dataset.v;renderSetup(load())},
 pers:el=>{SETUP.pers=el.dataset.v;renderSetup(load())},
 found:()=>{SETUP.name=($('#inCo').value||'').trim()||'Hudson Holdings';SETUP.ceoName=($('#inCeo').value||'').trim()||'A. Founder';SETUP.hq=$('#inHq').value;newGame(SETUP);boot(true)},
 continue:()=>{S=load();if(!S)return;boot(false)}
};

function boot(fresh){
 try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
 buildMap();buildTop();buildTicker();renderMarkers();paintDistricts();
 $('#coName').textContent=S.co.name;$('#coSub').textContent=SECTORS[S.co.sector].n+' · '+DM[S.co.hq].n;$('#coMono').textContent=S.co.name[0];$('#coMono').style.background=S.co.color;
 refreshAll();
 for(const k in TW)TW[k].cur=TW[k].t;
 $('#start').classList.add('gone');setTimeout(()=>{$('#start').hidden=true},950);
 G.running=true;G.prevSpeed=1;
 VB.x=150;VB.y=0;VB.w=980;fitVB();const hq=DM[S.co.hq].c;flyTo(hq[0]+60,hq[1]-10,640);
 if(fresh){S.speed=0;setTimeout(()=>{fxPulse(S.co.hq,S.co.color);showEvent({title:'A New Name on the Directory',who:ceo(),seed:3,tint:'#3a3a6a',text:`<em>${esc(S.co.name)}</em> opens its doors in ${DM[S.co.hq].n} with ${fmt$(S.co.cash)} in the bank, eleven employees and one loyal co-founder running Engineering.<br><br>Fill your council with heads of department, keep morale high, trade on the Exchange and buy up the city's businesses. Control fourteen districts, or reach a ${fmt$(2.5e9)} valuation, to claim the throne.`,opts:[{l:'Open for business',t:'The clock starts. Space pauses; 1, 2, 3 set the speed.',go(){S.speed=1;G.prevSpeed=1;updateTop()}}]});G.prevSpeed=1},1100)}
}

/* ============ loop ============ */
let last=performance.now();
const DAYMS=[0,1000,420,150];
function frame(now){const dt=Math.min(100,now-last);last=now;
 if(G.running){if(!G.modal&&S.speed>0){G.dayAcc+=dt;const L=DAYMS[S.speed];let n=0;while(G.dayAcc>=L&&n<4){G.dayAcc-=L;dayTick();n++;if(G.modal){G.dayAcc=0;break}}$('#dprog').style.width=(G.dayAcc/L*100).toFixed(1)+'%'}
  animMap(dt,now);tweenTick(dt);tickerMove(dt)}
 requestAnimationFrame(frame)}
applyOrientation();renderStart();requestAnimationFrame(frame);
</script>
